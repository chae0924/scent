        const main = {
    init: function() {
        this.mv = document.querySelector('#mv');

        // banner
        this.gridList = document.querySelector('.grid_lists');
        this.gridLists = Array.from(this.gridList.querySelectorAll('.grid_item'));
        this.gridLists.forEach(el => {
            el.addEventListener('click', event => {

            })

    moveFog: function() {
        this.fogTimeout;
        this.fogWrap = document.querySelector('#fogWrap');
        if(!fogWrap) return;
        this.currentX = fogWrap.getBoundingClientRect().left,
        this.currentY = fogWrap.getBoundingClientRect().top;
        this.isRender = false;
        this.speed = isMobile ? 2 : 4;
        document.addEventListener('mousemove', event => {
            this.event = event;
            if (this.fogTimeout) {
                clearTimeout(this.fogTimeout);
            }
            this.x = event.clientX;
            this.y = event.clientY;
            this.isRender = true;
        })
        
        const render = () => {
            if(this.isRender) {
                if(Math.abs((this.x + this.y) - (this.currentX + this.currentY)) > 50) {
                    let dx = this.x - this.currentX,
                        dy = this.y - this.currentY,
                        distance = Math.sqrt(dx ** 2 + dy ** 2);
                    
                    let moveX = dx / distance;
                    let moveY = dy / distance;
                    this.currentX += moveX * this.speed;
                    this.currentY += moveY * this.speed;
                    if(!this.isMoving) {
                        this.isMoving = setTimeout(() => {
                            gsap.to(this.fogWrap, {
                                x: this.currentX,
                                y: this.currentY,
                                duration: 0.1,
                            });
                            clearTimeout(this.isMoving);
                            this.isMoving = '';
                        }, 100);
                    }
                    this.elementX = this.x;
                    this.elementY = this.y;
                }
            }

            this.fogAnim = requestAnimationFrame(render);
        }
        this.fogAnim = requestAnimationFrame(render);
    },

function Flow() { }

Flow.prototype = {
    wrap: '',
    box: '',
    direction: 'left',
    speed: 2,
    degree: -1,
    total: 16,
    banners: [],
    group: 0,
    totalSize: '',
    size: '',
    matrix: '',
    translate: '',
    befTime: 0,
    stack: 0,
    loop: '',
    touchType: '',
    touchBl: false,
    startX: 0,
    moveX: 0,
    init: function (el) {
        this.wrap = el;
        this.box = this.wrap.querySelector('.conveyor_wrapper');
        this.banners = el.querySelectorAll('.conveyor_slide');
        this.initArray();


        var th = this;
        this.box.addEventListener('mouseenter', function (e) {
            th.stop();
        });
        this.box.addEventListener('mouseleave', function (e) {
            th.run();
            if (th.touchBl) th.touchBl = false;
        });
    },
    initArray: function () {
        var doc = document.createDocumentFragment();
        var cp = []; // copy
        while (true) {
            if ((this.banners.length + cp.length) - this.total >= 0) break;
            for (var i = 0; i < this.banners.length; i++) {
                var banner = this.banners[i];
                cp.push(banner.cloneNode(true));
                if (i > (this.banners.length - 1)) {
                    doc.prepend($(this.banners).slice()[i].cloneNode(true));
                } else {
                    doc.appendChild($(this.banners).slice()[i].cloneNode(true));
                }
            }
        }
        if (cp.length != 0) this.group = (cp.length / this.banners.length) + 1;
        this.box.append(doc);
        this.banners = this.box.querySelectorAll('.conveyor_slide');
        this.initArrage();
    },
    returnCeil: function (num) {
        return Math.ceil(num * 100) / 100;
    },
    initArrage: function () {
        this.calcTotalSize();
        this.box.style.transform = 'translateX(' + Math.ceil(-1 * this.totalSize / this.group) + 'px) rotate(0.01deg)';
    },
    calcTotalSize: function () {
        var cnt = this.banners.length;
        var wid = 0;
        console.log(this.banners[0]);
        console.log(this.banners[0].clientWidth);
        this.size = this.returnCeil(this.banners[0].offsetWidth);
        while (cnt) {
            wid += this.returnCeil(this.banners[--cnt].getBoundingClientRect().width);
        }
        wid = this.returnCeil(wid);
        this.totalSize = wid;
        this.box.style.width = this.totalSize + 'px';
    },
    saveMatrix: function () {
        this.matrix = $(this.box).css('transform').replace(/[^0-9\-.,]/g, '').split(',');
        this.translate = this.matrix[4];
    },
    relocation: function () {
        if (this.degree != -1) {
            this.box.prepend(this.banners[this.banners.length - 1]);
        } else {
            this.box.append(this.banners[0]);
        }
        this.banners = $(this.box).find('.conveyor_slide').slice();
    },
    stop: function () {
        cancelAnimationFrame(this.loop);
    },
    run: function (time) {
        var th = this;
        this.loop = requestAnimationFrame(loop);
        this.loop = requestAnimationFrame(loop);
        function loop(time) {
            th.saveMatrix();
            if (Math.abs(Math.floor(th.translate / th.size)) != th.stack) {
                // th.box.style.transform = 'translateX(' + (Number(th.translate) - (th.degree * th.size)) + 'px) rotate(0.01deg)';
                // th.relocation();
            //     th.saveMatrix();
            //     th.stack = Math.abs(Math.floor(th.translate / th.size));
            }else {
                th.stack = Math.abs(Math.floor(th.translate / th.size));
                th.box.style.transform = 'translateX(' + (Number(th.translate) + (th.degree * th.speed)) + 'px) rotate(0.01deg)'
            }
            th.loop = requestAnimationFrame(loop);
        }
    },
}


function isNode(value) {
    return value instanceof Node;
}

function isAttrObject(value) {
    return value != null && typeof value === 'object' && !isNode(value);
}

function setAttributes(element, object) {
    Object.keys(object).forEach(function (key) {
        element.setAttribute(key, object[key]);
    });
}

function toNode(value, doc) {
    switch (typeof value) {
        case 'boolean':
        case 'number':
        case 'string':
            return doc.createTextNode(value.toString());
        case 'undefined':
            return doc.createTextNode('undefined');
        default:
            if (value === null) {
                return doc.createTextNode('null');
            }

            if (isNode(value)) {
                return value;
            }

            if (Array.isArray(value) && value.length >= 1) {
                var element = doc.createElement(value[0]);

                var i = 1;

                if (value.length > i) {
                    if (isAttrObject(value[i])) {
                        setAttributes(element, value[i]);
                        i++;
                    }

                    if (value.length > i) {
                        element.append.apply(element, value.slice(i));
                    }
                }

                return element;
            }
            throw new Error();
    }
}

Node.prototype.append = function () {
    for (var i = 0; i < arguments.length; i++) {
        this.appendChild(toNode(arguments[i], this.ownerDocument));
    }
};
