<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부드러운 스크롤과 탑 버튼</title>
    <style>
        body {
            height: 300vh; /* 페이지를 길게 하여 스크롤 가능 */
            margin: 0;
            overflow: hidden; /* 스크롤바 숨기기 */
        }

        section {
            height: 100vh; /* 각 섹션의 높이 설정 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border: 1px solid #000;
        }

        #section1 { background: #ffcccc; }
        #section2 { background: #ccffcc; }
        #section3 { background: #ccccff; }

        /* 탑 버튼 스타일 */
        .top-button {
            position: fixed;
            bottom: 20px; /* 화면 하단에서 20px */
            right: 20px; /* 화면 오른쪽에서 20px */
            padding: 10px 15px;
            background-color: #f7acbc;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: none; /* 처음에는 숨김 */
            transition: background-color 0.3s;
        }

        .top-button:hover {
            background-color: #e62e51; /* 호버 시 색상 변경 */
        }
    </style>
</head>
<body>

<section id="section1">첫 번째 섹션</section>
<section id="section2">두 번째 섹션</section>
<section id="section3">세 번째 섹션</section>

<!-- 탑 버튼 추가 -->
<button id="topBtn" class="top-button">↑ 상단으로</button>

<script>
    let currentSection = 0; // 현재 섹션을 추적
    const sections = document.querySelectorAll('section'); // 모든 섹션 선택
    const topBtn = document.getElementById('topBtn'); // 탑 버튼

    // 스크롤 이벤트 리스너 추가
    window.addEventListener('wheel', (event) => {
        event.preventDefault(); // 기본 스크롤 방지
        if (event.deltaY > 0) { // 아래로 스크롤할 때
            if (currentSection < sections.length - 1) {
                currentSection++; // 다음 섹션으로 이동
            }
        } else { // 위로 스크롤할 때
            if (currentSection > 0) {
                currentSection--; // 이전 섹션으로 이동
            }
        }
        // 해당 섹션으로 부드럽게 스크롤 이동
        sections[currentSection].scrollIntoView({ behavior: 'smooth' });

        // 탑 버튼 표시/숨기기
        if (currentSection > 0) {
            topBtn.style.display = 'block'; // 탑 버튼 표시
        } else {
            topBtn.style.display = 'none'; // 탑 버튼 숨김
        }
    });

    // 탑 버튼 클릭 시 상단으로 부드럽게 스크롤
    topBtn.addEventListener('click', () => {
        sections[0].scrollIntoView({ behavior: 'smooth' }); // 상단으로 이동
        currentSection = 0; // 현재 섹션을 첫 번째 섹션으로 초기화
    });
</script>

</body>
</html>
