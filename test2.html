<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>텍스트 내부 색상 효과</title>
    <style>
        body {
            margin: 0;
            background-color: white;
            color: rgb(65, 65, 65);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        h1 {
            position: relative;
            font-size: 4rem;
            overflow: hidden; /* 텍스트 바깥 부분 숨김 */
        }
        .color-overlay {
            position: absolute;
            pointer-events: none; /* 마우스 이벤트를 받지 않게 */
            z-index: -1; /* 텍스트 뒤에 배치 */
            width: 100%; /* 전체 너비 */
            height: 100%; /* 전체 높이 */
            top: 0; /* 상단 맞춤 */
            left: 0; /* 좌측 맞춤 */
            mix-blend-mode: multiply; /* 색상 혼합 모드 */
            transition: opacity 0.3s ease; /* 부드러운 전환 */
            opacity: 0; /* 초기 투명도 */
        }
    </style>
</head>
<body>

<h1 id="text">향수처럼 흩어지는 텍스트</h1>
<div class="color-overlay" id="color-overlay"></div>

<script>
    const textElement = document.getElementById('text');
    const colorOverlay = document.getElementById('color-overlay');

    textElement.addEventListener('mousemove', (e) => {
        const rect = textElement.getBoundingClientRect();
        const x = e.clientX - rect.left; // 텍스트 내부의 X 좌표
        const y = e.clientY - rect.top; // 텍스트 내부의 Y 좌표

        // 색상 설정 (마우스 위치에 따라 변화)
        colorOverlay.style.backgroundColor = `rgba(255, 10, 1, 0.5)`; // 노란색
        colorOverlay.style.opacity = 1; // 불투명하게

        // 마우스 위치에 따라 색상이 드러나도록 합니다
        const gradientX = Math.round((x / rect.width) * 100); // X 축 위치 비율
        const gradientY = Math.round((y / rect.height) * 100); // Y 축 위치 비율
        colorOverlay.style.background = `radial-gradient(circle at ${gradientX}% ${gradientY}%, rgba(255, 255, 0, 0.5), rgba(0, 0, 0, 0))`;
    });

    textElement.addEventListener('mouseleave', () => {
        colorOverlay.style.opacity = 0; // 마우스가 벗어났을 때 투명하게
    });
</script>
</body>
</html>
