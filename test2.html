<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애니메이션 효과</title>
    <style>
        /* 감싸고 있는 섹션 스타일 */
        section {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: white;
            overflow: hidden;
        }

        /* 배경이 동그랗게 채워지는 효과를 위한 section의 ::before */
        section::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background-color: #f7acbc;
            border-radius: 50%;
            transition: width 0.5s ease-in, height 0.5s ease-in, top 0.5s ease-in, left 0.5s ease-in;
            z-index: 1;
            transform: translate(-50%, -50%);
        }

        /* a 태그 안의 h1 */
        a {
            text-decoration: none;
        }

        h1 {
            font-size: 40px;
            font-family: 'Arial', sans-serif;
            color: black;
            z-index: 1; /* 텍스트가 배경 위에 있게 */
            transition: color 0.3s;
        }

        /* h1에 호버할 때 section의 배경색을 동그랗게 채우기 */
        a:hover ~ section::before {
            width: 300%;
            /* !!!!! 중요! 비포는 0으로 되어있는데 거기에 300프로를 할 수없어 300vw|300vh로 수정 */
            height: 300%;
        }

        /* 호버 시 텍스트 색상 변화 */
        a:hover h1 {
            color: white;
        }
    </style>
</head>
<body>

<a href="#">
    <h1>호버해보세요</h1>
</a>

<section></section>

</body>
</html>
